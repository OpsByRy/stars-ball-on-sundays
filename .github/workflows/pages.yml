name: Publish SBOS
on:
  push:
    branches: [main]
  # Nightly full rebuild (5:17 AM ET in winter; off the hour, where GitHub delays or drops scheduled
  # runs): re-validates the whole archive and redeploys every
  # file; with the live data lane on (vars.SBOS_LIVE_LANE), boards and results go live between
  # these through live.yml instead.
  schedule:
    - cron: '17 10 * * *'
  workflow_dispatch:
    inputs:
      preview_artifact:
        description: Deploy sealed output to a preview only
        type: boolean
        default: false
  # Results commits are pushed with GITHUB_TOKEN, which never triggers `push`; results.yml starts
  # this workflow by workflow_dispatch only when it actually committed new results, so a refresh
  # with nothing new no longer rebuilds and redeploys the site.
permissions:
  contents: read
concurrency:
  group: sbos-pages
  cancel-in-progress: false
jobs:
  # With the live data lane on, a push that only adds published data (a board, an update) is
  # published by live.yml in about a minute; the full build then waits for the nightly run or the
  # next code change. Everything else (code, pages, schedule, manual and declined runs) builds.
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      full: ${{ steps.scope.outputs.full }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        if: github.event_name == 'push' && vars.SBOS_LIVE_LANE == 'on'
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: .github
          persist-credentials: false
      - id: scope
        env:
          LANE: ${{ vars.SBOS_LIVE_LANE }}
        run: |
          # Compared with the deploy Pages is serving, not the previous push: a code change still
          # waiting for its full build keeps every later run a full build.
          full=true
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$LANE" = on ]; then
            base="$(curl -fsS -A sbos-pages-scope https://sbos-public.pages.dev/_sbos-release.json | python3 -c 'import json,sys;print(json.load(sys.stdin)["sourceSHA"])' || true)"
            if [ -n "$base" ] && git merge-base --is-ancestor "$base" "$GITHUB_SHA" 2>/dev/null; then
              other="$(git diff --name-only "$base" "$GITHUB_SHA" | grep -vE '^(data/|assets/parlay-withdrawals\.json$|publication-window\.json$|pending-additions\.json$|pending-parlays\.json$)' || true)"
              if [ -z "$other" ]; then full=false; echo "Only published data changed since the live deploy ${base:0:12}: live.yml publishes it; the full build waits for the nightly run."; fi
            fi
          fi
          echo "full=$full" >> "$GITHUB_OUTPUT"
  # The full Python and Node suites still gate every deployment (cloudflare and handoff need
  # them), but they run next to the build instead of before it. Nov 22 timings on one runner:
  # Python tests 15.5 min + Node tests 2.7 min + host build 15.3 min + seal 4 min, in series.
  python-tests:
    needs: scope
    if: needs.scope.outputs.full == 'true'
    name: python tests (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      # Every module `unittest discover -s tests` finds is in exactly one shard.
      - run: python scripts/shard_tests.py --check --of 4
      - run: python scripts/shard_tests.py --shard ${{ matrix.shard }} --of 4
      - run: git diff --exit-code
  node-tests:
    needs: scope
    if: needs.scope.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      # Some Node tests call python3 (hosting redirects, edition digests).
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - run: node --test tests/*.test.cjs
      - run: git diff --exit-code
  build:
    needs: scope
    if: needs.scope.outputs.full == 'true'
    outputs:
      source_sha: ${{ steps.seal.outputs.source_sha }}
      manifest_sha: ${{ steps.seal.outputs.manifest_sha }}
    runs-on: ubuntu-latest
    # Allow full archive validation, both host builds and sealing to finish. 40 minutes stopped
    # being enough as the archive grew (Nov 22: tests 19 + host builds 17 + seal; Nov 21: 37).
    # The test suites now run in their own jobs; the margin stays for archive growth.
    timeout-minutes: 75
    permissions:
      contents: read
      pages: read
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - run: git diff --exit-code
      - run: python scripts/build_hosts.py --publish
      - run: git diff --exit-code
      - name: Seal the complete validated outputs
        id: seal
        run: |
          mkdir -p .release
          SOURCE_SHA=$(git rev-parse HEAD)
          python scripts/release_artifact.py seal --output .release/sealed --source-sha "$SOURCE_SHA" > .release/seal.json
          python - <<'PYTHON'
          import json, os
          receipt = json.load(open('.release/seal.json'))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('source_sha=' + receipt['sourceSHA'] + '\n')
              output.write('manifest_sha=' + receipt['manifestSHA256'] + '\n')
          PYTHON
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbos-sealed-${{ github.run_id }}-${{ github.run_attempt }}
          path: .release/sealed
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
  cloudflare:
    needs: [build, python-tests, node-tests]
    if: vars.SBOS_ARTIFACT_DEPLOY == 'enabled' || inputs.preview_artifact == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Only scripts and root files (hosting-policy.json) are used here; the deployed bytes come
      # from the sealed artifact. Skipping the 10 GB archive checkout saves ~2.5 min per job.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.build.outputs.source_sha }}
          persist-credentials: false
          filter: blob:none
          sparse-checkout: scripts
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sbos-sealed-${{ github.run_id }}-${{ github.run_attempt }}
          path: .release/sealed
      - name: Verify every file against the trusted build digest
        env:
          SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
          MANIFEST_SHA: ${{ needs.build.outputs.manifest_sha }}
        run: python scripts/release_artifact.py verify --artifact .release/sealed --source-sha "$SOURCE_SHA" --manifest-sha "$MANIFEST_SHA"
      - name: Require the explicitly provisioned deployment credential
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.SBOS_CLOUDFLARE_PAGES_TOKEN }}
        run: test -n "$CLOUDFLARE_API_TOKEN"
      - name: Refuse competing builds or an obsolete production source
        if: inputs.preview_artifact != true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.SBOS_CLOUDFLARE_PAGES_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
        run: |
          # The source must be main or an earlier commit of main. During games the results workflow
          # commits every ~10 min and a deploy takes ~12 min to get here, so requiring main's exact
          # tip refused every deploy (Nov 13, 6:43-9:12 PM ET: no board, lineup or result update went
          # live). Runs are serialized (concurrency sbos-pages, only the newest waits), so the newer
          # main is already queued behind this one; a source not on main is still refused.
          status="$(gh api "repos/OpsByRy/stars-ball-on-sundays/compare/${SOURCE_SHA}...main" --jq .status)"
          echo "main compared with this source: $status"
          test "$status" = identical || test "$status" = ahead
          python - <<'PYTHON'
          import json, os, urllib.request
          url = 'https://api.cloudflare.com/client/v4/accounts/fbdf495767bb144edfcbb7f1609e2629/pages/projects/sbos-public'
          request = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + os.environ['CLOUDFLARE_API_TOKEN']})
          with urllib.request.urlopen(request, timeout=30) as response:
              body = json.load(response)
          if not body.get('success'):
              raise SystemExit('Could not verify Cloudflare project state')
          project = body['result']
          config = project['source']['config']
          if config.get('production_deployments_enabled') is not False:
              raise SystemExit('Disable duplicate Cloudflare Git production builds before artifact cutover')
          # starsballonsundays.com moved to the redesign Worker on 2026-11-12; this project is its data store.
          if project['name'] != 'sbos-public' or project.get('subdomain') != 'sbos-public.pages.dev':
              raise SystemExit('Production destination differs from the reviewed project')
          PYTHON
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Upload the verified bytes without a build
        id: upload
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          workingDirectory: .release/sealed
          wranglerVersion: '4.157.0'
          apiToken: ${{ secrets.SBOS_CLOUDFLARE_PAGES_TOKEN }}
          accountId: fbdf495767bb144edfcbb7f1609e2629
          command: pages deploy dist-cloudflare --project-name=sbos-public --branch=${{ inputs.preview_artifact == true && 'artifact-preview' || 'main' }} --commit-hash=${{ needs.build.outputs.source_sha }} --commit-dirty=false
      - name: Verify the immutable preview deployment
        if: inputs.preview_artifact == true
        env:
          PREVIEW_URL: ${{ steps.upload.outputs.deployment-url }}
        run: python scripts/verify_cloudflare_release.py --origin "$PREVIEW_URL" --artifact .release/sealed/dist-cloudflare --attempts 6
  handoff:
    needs: [build, python-tests, node-tests, cloudflare]
    if: always() && needs.build.result == 'success' && needs.python-tests.result == 'success' && needs.node-tests.result == 'success' && inputs.preview_artifact != true && (needs.cloudflare.result == 'success' || (vars.SBOS_ARTIFACT_DEPLOY != 'enabled' && needs.cloudflare.result == 'skipped'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pages: read
    steps:
      # Only scripts and root files (hosting-policy.json) are used here; the deployed bytes come
      # from the sealed artifact. Skipping the 10 GB archive checkout saves ~2.5 min per job.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.build.outputs.source_sha }}
          persist-credentials: false
          filter: blob:none
          sparse-checkout: scripts
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sbos-sealed-${{ github.run_id }}-${{ github.run_attempt }}
          path: .release/sealed
      - name: Verify the sealed GitHub handoff and Cloudflare bytes
        env:
          SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
          MANIFEST_SHA: ${{ needs.build.outputs.manifest_sha }}
        run: python scripts/release_artifact.py verify --artifact .release/sealed --source-sha "$SOURCE_SHA" --manifest-sha "$MANIFEST_SHA"
      - name: Require the exact healthy Cloudflare release before GitHub handoffs
        run: python scripts/verify_cloudflare_release.py --artifact .release/sealed/dist-cloudflare
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: .release/sealed/dist-github

  # The live layer sits on top of the deploy Pages serves; after a new full deploy, rebuild it on
  # the new base (an empty layer when nothing landed meanwhile).
  live-rebase:
    needs: cloudflare
    if: needs.cloudflare.result == 'success' && inputs.preview_artifact != true && (vars.SBOS_LIVE_LANE == 'on' || vars.SBOS_LIVE_LANE == 'shadow')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run live.yml --repo "$GITHUB_REPOSITORY" --ref main -f reason=after-full-deploy
  deploy:
    needs: handoff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy SBOS
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
