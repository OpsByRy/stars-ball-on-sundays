name: Publish SBOS
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: [Refresh public results]
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: sbos-pages
  cancel-in-progress: false
jobs:
  build:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pages: read
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Download the exact trusted result source
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sbos-result-release
          path: .release/result
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Check out the result workflow's actual final commit
        if: github.event_name == 'workflow_run'
        env:
          SBOS_RESULT_BASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: python scripts/resolve_result_release.py .release/result/source.json --base-sha "$SBOS_RESULT_BASE_SHA"
      - run: python -m unittest discover -s tests
      - run: node --test tests/*.test.cjs
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - run: python scripts/build_hosts.py --publish
      - name: Require the exact healthy Cloudflare release before GitHub handoffs
        run: python scripts/verify_cloudflare_release.py
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist-github
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy SBOS
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
