name: Refresh public results
on:
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'
permissions:
  contents: write
concurrency:
  group: public-result-records
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: node scripts/refresh-results.cjs
      - run: python scripts/build.py
      - name: Save statistical updates
        run: |
          if [ -n "$(git status --porcelain -- data/editions data/plus-money data/player-availability.json)" ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data/editions data/plus-money data/player-availability.json
            git commit -m 'Update published statistical results'
            git push
          fi
      - name: Record the exact final source, including a new result commit
        env:
          SBOS_RESULT_BASE_SHA: ${{ github.sha }}
        run: |
          mkdir -p .release/result
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          receipt = {
              'schemaVersion': 'sbos-result-release-1',
              'repository': 'OpsByRy/stars-ball-on-sundays',
              'branch': 'main',
              'baseSHA': os.environ['SBOS_RESULT_BASE_SHA'],
              'sourceSHA': subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          }
          Path('.release/result/source.json').write_text(json.dumps(receipt)+'\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbos-result-release
          path: .release/result/source.json
          retention-days: 7
